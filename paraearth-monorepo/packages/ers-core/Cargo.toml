[package]
name = "ers-core"
version = "0.1.0"
edition = "2021"
description = "Elemental Reaction Substrate - Web-native chemistry simulation engine"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.89"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6.3"
js-sys = "0.3.66"
lazy_static = "1.4.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"